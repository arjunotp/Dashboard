<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f3f5fb;
            --surface: #ffffff;
            --surface-soft: #f8faff;
            --ink: #1b2138;
            --ink-muted: #65708a;
            --line: #dfe6f3;
            --blue: #2e7de8;
            --blue-strong: #2468cc;
            --shadow: 0 8px 26px rgba(60, 83, 136, 0.12);
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --layout-max-width: 1600px;
            --layout-side-gap: 18px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Manrope", sans-serif;
            animation: fadeInBody 0.8s ease-in;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-shell {
            min-height: 100vh;
            background: linear-gradient(180deg, #f8faff 0%, #f3f5fb 32%, #f0f3fb 100%);
        }

        .top-nav-wrap {
            border-bottom: 1px solid #e8edf8;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
        }

        .top-nav {
            max-width: var(--layout-max-width);
            margin: 0 auto;
            padding: 20px var(--layout-side-gap);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0;
            font-weight: 800;
            font-size: 2rem;
            color: #222c48;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .top-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            flex: 1;
        }

        .top-link {
            border: 0;
            background: transparent;
            padding: 9px 14px;
            border-radius: 10px;
            color: #28334f;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .top-link:hover,
        .top-link.active {
            background: #eaf1ff;
            color: #1f5ec2;
        }

        .top-link:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #logoutBtn {
            border: 0;
            padding: 10px 16px;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(180deg, #3f8bf7, #2f73da);
            box-shadow: 0 8px 18px rgba(60, 116, 211, 0.24);
        }

        #logoutBtn:hover {
            background: linear-gradient(180deg, #347fe9, #2867ca);
        }

        .hero-wrap {
            max-width: var(--layout-max-width);
            margin: 0 auto;
            padding: 28px var(--layout-side-gap) 0;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-xl);
            border: 1px solid #e3e9f6;
            background:
                radial-gradient(circle at 18% 18%, rgba(163, 196, 255, 0.22), rgba(163, 196, 255, 0) 44%),
                radial-gradient(circle at 80% 62%, rgba(139, 185, 255, 0.25), rgba(139, 185, 255, 0) 45%),
                linear-gradient(140deg, #f9fbff 0%, #edf3ff 44%, #e6eeff 100%);
            min-height: 460px;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            align-items: center;
            gap: 22px;
            padding: 48px 42px;
            box-shadow: var(--shadow);
        }

        .hero-title {
            margin: 0 0 18px;
            font-size: clamp(2.3rem, 4vw, 4.3rem);
            line-height: 1.05;
            letter-spacing: -0.03em;
            font-weight: 800;
            color: #1d2440;
        }

        .hero-subtitle {
            margin: 0 0 30px;
            max-width: 520px;
            color: #475473;
            font-size: clamp(1rem, 1.8vw, 1.9rem);
            line-height: 1.42;
            font-weight: 500;
        }

        .hero-cta {
            border: 0;
            border-radius: 10px;
            padding: 14px 22px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(180deg, #4a93ff, #2d73de);
            box-shadow: 0 12px 22px rgba(63, 116, 214, 0.28);
        }

        .hero-cta:hover {
            background: linear-gradient(180deg, #3f87ef, #2667c5);
        }

        .hero-visual {
            position: relative;
            min-height: 340px;
        }

        .hero-visual .panel {
            position: absolute;
            border-radius: 18px;
            background: #fff;
            border: 1px solid #e7edf9;
            box-shadow: 0 12px 26px rgba(60, 85, 140, 0.16);
        }

        .hero-visual .panel.main {
            inset: 12px 58px 26px 0;
            padding: 14px 16px;
        }

        .hero-visual .panel.small {
            width: 186px;
            height: 118px;
            right: 0;
            top: 84px;
            padding: 14px;
        }

        .hero-visual .panel.pie {
            width: 192px;
            height: 150px;
            right: 8px;
            bottom: 0;
            padding: 16px;
        }

        .visual-row {
            height: 8px;
            border-radius: 6px;
            background: linear-gradient(90deg, #d2ddf8, #edf2ff);
            margin-bottom: 14px;
        }

        .visual-chart {
            height: 130px;
            border-radius: 12px;
            background:
                linear-gradient(180deg, #f8fbff 0 88%, #eef3ff 88% 100%);
            border: 1px solid #edf2fc;
            position: relative;
            overflow: hidden;
        }

        .visual-chart::after {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 30%;
            height: 2px;
            background: linear-gradient(90deg, #99b7f4, #2f76de);
            transform: rotate(-7deg);
            box-shadow:
                46px 18px 0 -1px #4f84e0,
                112px -8px 0 -1px #77a2ee,
                168px 12px 0 -1px #3f78dc,
                236px -10px 0 -1px #6f9deb;
        }

        .mini-bars {
            height: 70px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 7px;
            align-items: end;
        }

        .mini-bars span {
            border-radius: 4px 4px 1px 1px;
            background: linear-gradient(180deg, #63c8b7, #4f86e5);
        }

        .mini-bars span:nth-child(1) { height: 38px; }
        .mini-bars span:nth-child(2) { height: 50px; }
        .mini-bars span:nth-child(3) { height: 28px; }
        .mini-bars span:nth-child(4) { height: 56px; }
        .mini-bars span:nth-child(5) { height: 40px; }
        .mini-bars span:nth-child(6) { height: 60px; }

        .pie-chart-illus {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin: 0 auto;
            background: conic-gradient(#5d94ee 0 62%, #8bc8ff 62% 81%, #d4e7ff 81% 100%);
            box-shadow: inset 0 0 0 18px #f7fbff;
        }

        .pizza-icon {
            position: absolute;
            right: 8px;
            bottom: -2px;
            font-size: 2rem;
            transform: rotate(-8deg);
        }

        .tiles-shell {
            max-width: var(--layout-max-width);
            margin: -40px auto 0;
            padding: 0 var(--layout-side-gap);
            position: relative;
            z-index: 5;
        }

        .tiles-card {
            background: rgba(249, 252, 255, 0.96);
            border: 1px solid #e3eaf7;
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        #tile-container {
            margin: 0 !important;
        }

        .tile-grid-item {
            padding: 9px;
        }

        .tile {
            cursor: pointer;
            min-height: 106px;
            border-radius: var(--radius-lg);
            border: 1px solid #e6ecf8;
            background: #fff;
            box-shadow: 0 8px 16px rgba(83, 105, 157, 0.1);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 18px;
            text-align: left;
            transition: all 0.22s ease;
        }

        .tile:hover {
            transform: translateY(-3px);
            border-color: #d0ddf6;
            box-shadow: 0 14px 26px rgba(78, 105, 167, 0.17);
        }

        .tile.active {
            border-color: #84aef5;
            box-shadow: 0 14px 28px rgba(66, 119, 214, 0.22);
            background: linear-gradient(180deg, #f7fbff, #edf4ff);
        }

        .tile-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            color: #2f74da;
            background: linear-gradient(180deg, #e2eeff, #cfe0ff);
            flex-shrink: 0;
        }

        .tile h4 {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.2;
            color: #1e2742;
            font-weight: 700;
        }

        .tile small {
            display: block;
            margin-top: 4px;
            color: #7b86a2;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .tile.restricted {
            opacity: 0.58;
            cursor: not-allowed;
        }

        .tile.restricted:hover {
            transform: none;
            box-shadow: 0 8px 16px rgba(83, 105, 157, 0.1);
            border-color: #e6ecf8;
            background: #fff;
        }

        .tabs-shell {
            max-width: var(--layout-max-width);
            margin: 24px auto 0;
            padding: 0 var(--layout-side-gap) 24px;
        }

        .tab-section {
            background: #f7f9ff;
            border: 1px solid #e2e9f7;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 24px 18px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 4px 6px 16px;
            border-bottom: 1px solid #e5ebf8;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .section-header p {
            margin: 6px 0 0;
            color: #65708a;
            font-size: 1rem;
            font-weight: 600;
        }

        .section-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            min-width: 290px;
        }

        .search-pill {
            flex: 1;
            background: #fff;
            border: 1px solid #dce5f5;
            border-radius: 12px;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            color: #7a86a3;
            font-size: 0.95rem;
        }

        .search-pill i { font-size: 1rem; }

        .mini-download {
            border: 1px solid #92b6f0;
            background: #eef5ff;
            color: #1f5ec2;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .nav-tabs {
            border-bottom: 0;
            gap: 8px;
            overflow-x: auto;
            flex-wrap: nowrap;
            padding: 0 6px 14px;
            margin-bottom: 10px;
        }

        .nav-tabs .nav-item {
            white-space: nowrap;
        }

        .nav-tabs .nav-link {
            border: 0;
            border-radius: 10px;
            color: #526281;
            font-weight: 700;
            font-size: 0.9rem;
            background: #eef3ff;
            padding: 9px 14px;
        }

        .nav-tabs .nav-link.active {
            background: #2f78e1;
            color: #fff;
            box-shadow: 0 10px 18px rgba(45, 109, 203, 0.24);
        }

        .hidden { display: none !important; }

        .tab-content {
            background: #fff;
            border: 1px solid #e1e8f6;
            border-radius: var(--radius-lg);
            padding: 14px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .table-responsive {
            border: 1px solid #e4ebf8;
            border-radius: 12px;
            background: #fff;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        table.dataTable {
            width: max-content !important;
            min-width: 100% !important;
        }

        table.dataTable thead th {
            background: #f3f7ff;
            border-bottom: 1px solid #dce6fa !important;
            color: #3a4768;
            font-weight: 700;
        }

        table.dataTable tbody tr:nth-child(even) {
            background: #fbfdff;
        }

        .download-btn,
        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-success {
            border-radius: 10px !important;
            font-weight: 700 !important;
        }

        .analytics-filter-box {
            border: 1px solid #dbe4f6;
            border-radius: 10px;
            padding: 10px;
            max-height: 220px;
            overflow-y: auto;
            background: #fff;
        }

        .analytics-filter-header {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #4a5879;
        }

        .footer-wrap {
            border-top: 1px solid #e4ebf9;
            background: #f7f9ff;
            margin-top: 22px;
        }

        .footer-inner {
            max-width: var(--layout-max-width);
            margin: 0 auto;
            padding: 24px var(--layout-side-gap) 34px;
            display: flex;
            justify-content: space-between;
            gap: 22px;
            flex-wrap: wrap;
            color: #6f7c98;
            font-size: 1rem;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 0;
            font-size: 2rem;
            font-weight: 800;
            color: #252f4a;
            margin-bottom: 12px;
        }

        .footer-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #6b7792;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .footer-icons i {
            font-size: 1.15rem;
            color: #8592ad;
        }

        .last-refresh {
            max-width: var(--layout-max-width);
            margin: 0 auto;
            padding: 8px var(--layout-side-gap) 18px;
            color: #7c88a5;
            font-size: 0.85rem;
            text-align: right;
        }

        @media (max-width: 991.98px) {
            .top-nav {
                padding: 14px 16px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .top-links {
                order: 3;
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
            }

            #logoutBtn {
                margin-left: auto;
            }

            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
                padding: 28px 22px;
            }

            .hero-visual {
                min-height: 280px;
            }

            .section-header h2 {
                font-size: 1.8rem;
            }

            .tile-grid-item {
                padding: 7px;
            }
        }

        @media (max-width: 767.98px) {
            .top-nav {
                padding: 14px 14px;
            }

            .brand {
                font-size: 1.25rem;
            }

            .hero-wrap,
            .tiles-shell,
            .tabs-shell,
            .footer-inner,
            .last-refresh {
                padding-left: 14px;
                padding-right: 14px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 0 2px 12px;
                margin-bottom: 14px;
            }

            .section-actions {
                min-width: 100%;
                width: 100%;
                flex-wrap: wrap;
            }

            .search-pill,
            .mini-download {
                width: 100%;
            }

            .hero {
                padding: 22px 16px;
                gap: 10px;
                min-height: 0;
            }

            .hero-title {
                font-size: 2rem;
                line-height: 1.1;
                margin-bottom: 10px;
            }

            .hero-subtitle {
                font-size: 0.98rem;
                margin-bottom: 16px;
            }

            .hero-cta {
                width: 100%;
            }

            .hero-visual {
                display: none;
            }

            .tiles-card {
                padding: 10px;
            }

            .tile {
                min-height: 88px;
                padding: 14px 12px;
            }

            .tile h4 {
                font-size: 1rem;
            }

            .tab-section {
                padding: 14px 10px;
            }

            .section-header h2 {
                font-size: 1.55rem;
            }

            .section-header p {
                font-size: 0.9rem;
            }

            .nav-tabs {
                padding: 0 0 10px;
                margin-bottom: 8px;
            }

            .nav-tabs .nav-link {
                font-size: 0.8rem;
                padding: 8px 11px;
            }

            .tab-content {
                padding: 8px;
            }

            .dataTables_wrapper .dataTables_length,
            .dataTables_wrapper .dataTables_filter,
            .dataTables_wrapper .dataTables_info,
            .dataTables_wrapper .dataTables_paginate {
                float: none !important;
                text-align: left !important;
                width: 100%;
                margin-bottom: 8px;
            }

            .dataTables_wrapper .dataTables_filter input,
            .dataTables_wrapper .dataTables_length select {
                width: 100%;
                margin-left: 0 !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button {
                padding: 0.25em 0.5em !important;
            }

            .footer-inner {
                gap: 12px;
            }

            .footer-brand {
                font-size: 1.4rem;
            }

            .footer-icons {
                width: 100%;
                justify-content: flex-start;
            }
        }

    </style>
</head>
<body>
<div class="dashboard-shell">
    <header class="top-nav-wrap">
        <div class="top-nav">
            <div class="brand">
                <span>Pizza Pie Land</span>
            </div>
            <nav class="top-links" id="topNavLinks" aria-label="Primary"></nav>
            <button id="logoutBtn" type="button">Logout <i class="bi bi-caret-down-fill ms-1" style="font-size:0.75em;"></i></button>
        </div>
    </header>

    <section class="hero-wrap">
        <div class="hero">
            <div class="hero-copy">
                <h1 class="hero-title">Pizza Pie Land Dashboard</h1>
                <p class="hero-subtitle">Comprehensive analytics and reports for your pizza outlet business.</p>
                <button class="hero-cta" id="heroSummaryBtn" type="button">View Final Summary <i class="bi bi-caret-down-fill ms-2" style="font-size:0.75em;"></i></button>
            </div>
            <div class="hero-visual" aria-hidden="true">
                <div class="panel main">
                    <div class="visual-row" style="width: 44%;"></div>
                    <div class="visual-row" style="width: 58%;"></div>
                    <div class="visual-chart"></div>
                </div>
                <div class="panel small">
                    <div class="visual-row" style="width: 56%;"></div>
                    <div class="mini-bars">
                        <span></span><span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <div class="panel pie">
                    <div class="visual-row" style="width: 50%;"></div>
                    <div class="pie-chart-illus"></div>
                    <div class="pizza-icon"><i class="bi bi-pie-chart-fill"></i></div>
                </div>
            </div>
        </div>
    </section>

    <section class="tiles-shell">
        <div class="tiles-card">
            <div class="row" id="tile-container"></div>
        </div>
    </section>

    <main class="tabs-shell">
        <section class="tab-section">
            <div class="section-header">
                <div>
                    <h2 id="sectionHeading">Final Summary</h2>
                    <p id="sectionSubHeading">POS Sales Performance and Inventory Overview</p>
                </div>
                <div class="section-actions">
                    <div class="search-pill"><i class="bi bi-search"></i> Search</div>
                    <button class="mini-download" id="sectionDownloadBtn" type="button">Download</button>
                </div>
            </div>
            <ul class="nav nav-tabs" id="dataTabs" role="tablist"></ul>
            <div class="tab-content" id="tab-content"></div>
        </section>
    </main>

    <p class="last-refresh">
        Last refreshed: <strong id="lastRefreshed">Loading...</strong>
    </p>

    <footer class="footer-wrap">
        <div class="footer-inner">
            <div>
                <div class="footer-brand">
                    <span>Pizza Pie Land</span>
                </div>
                <div class="footer-links">
                    <a href="javascript:void(0)">Terms of Service</a>
                    <a href="javascript:void(0)">Privacy Policy</a>
                    <a href="javascript:void(0)">Support</a>
                </div>
            </div>
            <div class="footer-icons" aria-label="Social links">
                <i class="bi bi-twitter-x"></i>
                <i class="bi bi-facebook"></i>
                <i class="bi bi-instagram"></i>
                <i class="bi bi-linkedin"></i>
            </div>
        </div>
    </footer>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<script>

const isAuthed = localStorage.getItem("dashboard_authed") === "true" ||
                 sessionStorage.getItem("dashboard_authed") === "true";
const currentRole = localStorage.getItem("dashboard_role") ||
                    sessionStorage.getItem("dashboard_role") ||
                    "admin";
const isAuditor = currentRole === "auditor";

if (!isAuthed) {
    window.location.replace("Login.html");
}

const logoutBtn = document.getElementById("logoutBtn");
logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("dashboard_authed");

function parseNumericValue(value) {
    if (value === null || value === undefined) return null;
    if (typeof value === "number") return Number.isFinite(value) ? value : null;

    const normalized = String(value).trim().replace(/,/g, "");
    if (!normalized) return null;

    const parsed = Number(normalized);
    return Number.isFinite(parsed) ? parsed : null;
}

function isNumericColumn(rows, field) {
    const populatedValues = rows
        .map(row => row[field])
        .filter(value => value !== null && value !== undefined && String(value).trim() !== "");

    if (!populatedValues.length) return false;
    return populatedValues.every(value => parseNumericValue(value) !== null);
}

function showAdminOnlyNotification() {

}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

                            if (!numericFields.has(field)) {

                                title: field,
                                data: row => row[field],

                                        ? numericValue.toFixed(2)
                                        : String(Math.trunc(numericValue));

function handleGroupClick(groupIndex) {
    if (isAuditor && groupIndex !== auditorGroupIndex) {
        showAdminOnlyNotification();
        return;
    }
    filterTabs(groupIndex);
}

function filterTabs(groupIndex) {
    if (isAuditor && groupIndex !== auditorGroupIndex) {
        showAdminOnlyNotification();
        return;
    }

    document.querySelectorAll('#dataTabs li').forEach(li => li.classList.add('hidden'));
    let firstBtn = null;

    document.querySelectorAll(`#dataTabs li[data-group="${groupIndex}"]`).forEach(li => {
        li.classList.remove('hidden');
        if (!firstBtn) firstBtn = li.querySelector('button');
    });

    document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));

    if (firstBtn) {
        firstBtn.classList.add('active');
        document.querySelector(firstBtn.dataset.bsTarget).classList.add('show', 'active');
    }

    // Group switching is handled manually, so trigger DataTables width recalculation.
    setTimeout(() => {
        Object.values(tableMap).forEach(t => t && t.columns.adjust());
    }, 0);

    const selectedGroup = config[groupIndex];
    const sectionHeading = document.getElementById("sectionHeading");
    const sectionSubHeading = document.getElementById("sectionSubHeading");
    if (selectedGroup && sectionHeading) {
        sectionHeading.textContent = selectedGroup.subtabs?.[0]?.label || selectedGroup.label;
    }
    if (selectedGroup && sectionSubHeading) {
        sectionSubHeading.textContent = `${selectedGroup.label} insights and drill-ready tables`;
    }

    document.querySelectorAll("#tile-container .tile").forEach((tileEl, idx) => {
        tileEl.classList.toggle("active", idx === groupIndex);
    });

    document.querySelectorAll("#topNavLinks .top-link").forEach(link => {
        link.classList.toggle("active", Number(link.dataset.group) === groupIndex);
    });
}

function renderDrilldownAnalyticsChart(tabId, sub) {
    Papa.parse(sub.csv, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: res => {
            const percentField = sub.percentField || "consumed-stock_amount%";
            const amountField = sub.amountField || "consumed-stock_amount";
            const rows = (res.data || []).filter(row =>
                row["Month_code"] &&
                row["Category"] &&
                row["Subcategory"] &&
                row["Item_Name"] &&
                parseNumericValue(row[percentField]) !== null
            );
            if (!rows.length) return;

            const allMonths = [...new Set(rows.map(row => row["Month_code"]))].sort();
            const defaultMonths = allMonths.slice(-12);
            analyticsStateMap[tabId] = {
                rows,
                allMonths,
                selectedMonths: new Set(defaultMonths.length ? defaultMonths : allMonths),
                percentField,
                amountField,
                metricMode: "percent",
                level: "category",
                selectedCategory: null,
                selectedSubcategory: null,
            };

            buildAnalyticsMonthFilter(tabId, allMonths);
            wireDrilldownEvents(tabId);
            updateDrilldownChart(tabId);
        }
    });
}

function buildAnalyticsMonthFilter(tabId, months) {
    const box = document.getElementById(`${tabId}MonthFilterBox`);
    const state = analyticsStateMap[tabId];
    if (!box || !state) return;

    box.innerHTML = months.map(month => {
        const checked = state.selectedMonths.has(month) ? "checked" : "";
        const safeValue = escapeHtml(month);
        const encodedValue = encodeURIComponent(month);
        const safeId = `${tabId}_month_${encodedValue}`;
        return `
            <div class="form-check mb-1">
                <input class="form-check-input analytics-month-checkbox" type="checkbox" data-value="${encodedValue}" id="${safeId}" ${checked}>
                <label class="form-check-label" for="${safeId}">${safeValue}</label>
            </div>`;
    }).join("");
}

function wireDrilldownEvents(tabId) {
    const state = analyticsStateMap[tabId];
    if (!state || state.eventsBound) return;
    state.eventsBound = true;

    const monthSearch = document.getElementById(`${tabId}MonthSearch`);
    const monthBox = document.getElementById(`${tabId}MonthFilterBox`);
    const monthSelectAll = document.getElementById(`${tabId}MonthSelectAll`);
    const monthClear = document.getElementById(`${tabId}MonthClear`);
    const resetZoom = document.getElementById(`${tabId}ResetZoom`);
    const metricToggle = document.getElementById(`${tabId}MetricToggle`);
    const downloadGraphData = document.getElementById(`${tabId}DownloadGraphData`);
    const backBtn = document.getElementById(`${tabId}Back`);
    const drillDownBtn = document.getElementById(`${tabId}DrillDown`);
    const drillSearch = document.getElementById(`${tabId}DrillSearch`);
    const drillSeriesList = document.getElementById(`${tabId}DrillSeriesList`);

    const filterCheckboxList = (box, searchValue) => {
        const query = (searchValue || "").trim().toLowerCase();
        box.querySelectorAll(".form-check").forEach(wrapper => {
            const label = wrapper.querySelector("label")?.textContent?.toLowerCase() || "";
            wrapper.style.display = !query || label.includes(query) ? "" : "none";
        });
    };

    monthSearch?.addEventListener("input", () => filterCheckboxList(monthBox, monthSearch.value));

    monthBox?.addEventListener("change", (e) => {
        if (!e.target.classList.contains("analytics-month-checkbox")) return;
        const value = decodeURIComponent(e.target.dataset.value);
        if (e.target.checked) state.selectedMonths.add(value);
        else state.selectedMonths.delete(value);
        updateDrilldownChart(tabId);
    });

    monthSelectAll?.addEventListener("click", () => {
        state.selectedMonths = new Set(state.allMonths);
        buildAnalyticsMonthFilter(tabId, state.allMonths);
        filterCheckboxList(monthBox, monthSearch.value);
        updateDrilldownChart(tabId);
    });

    monthClear?.addEventListener("click", () => {
        state.selectedMonths = new Set();
        buildAnalyticsMonthFilter(tabId, state.allMonths);
        filterCheckboxList(monthBox, monthSearch.value);
        updateDrilldownChart(tabId);
    });

    resetZoom?.addEventListener("click", () => {
        if (chartMap[tabId]) chartMap[tabId].resetZoom();
    });

    metricToggle?.addEventListener("click", () => {
        state.metricMode = state.metricMode === "percent" ? "amount" : "percent";
        updateDrilldownChart(tabId);
    });

    downloadGraphData?.addEventListener("click", () => {
        exportCurrentDrilldownChartData(tabId);
    });

    backBtn?.addEventListener("click", () => {
        if (state.level === "item") {
            state.level = "subcategory";
            state.selectedSubcategory = null;
        } else if (state.level === "subcategory") {
            state.level = "category";
            state.selectedCategory = null;
        }
        updateDrilldownChart(tabId);
    });

    drillSearch?.addEventListener("input", () => {
        state.drillSearchQuery = drillSearch.value || "";
        renderDrillSeriesList(tabId, state.currentSeries || []);
    });

    drillDownBtn?.addEventListener("click", () => {
        const selected = drillSeriesList?.value || "";
        if (!selected) return;
        if (state.level === "category") {
            state.level = "subcategory";
            state.selectedCategory = selected;
            state.selectedSubcategory = null;
            updateDrilldownChart(tabId);
        } else if (state.level === "subcategory") {
            state.level = "item";
            state.selectedSubcategory = selected;
            updateDrilldownChart(tabId);
        }
    });

    drillSeriesList?.addEventListener("dblclick", () => {
        drillDownBtn?.click();
    });
}

function exportCurrentDrilldownChartData(tabId) {
    const state = analyticsStateMap[tabId];
    const chart = chartMap[tabId];
    if (!state || !chart) return;

    const months = chart.data?.labels || [];
    const datasets = chart.data?.datasets || [];
    if (!months.length || !datasets.length) return;

    const metricLabel = state.metricMode === "amount" ? "Amount" : "Percent";
    const rows = [];
    months.forEach((month, monthIdx) => {
        datasets.forEach(ds => {
            const val = ds.data?.[monthIdx];
            rows.push({
                Level: state.level,
                Category: state.selectedCategory || "",
                Subcategory: state.selectedSubcategory || "",
                Series: ds.label || "",
                Month_code: month,
                Metric: metricLabel,
                Value: val ?? ""
            });
        });
    });

    const csv = Papa.unparse(rows);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const safeLevel = (state.level || "level").replace(/[^a-z0-9_-]/gi, "_");
    const safeMetric = state.metricMode === "amount" ? "amount" : "percent";
    a.download = `${tabId}_${safeLevel}_${safeMetric}_graph_data.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function getDrilldownSeries(state, selectedMonths) {
    const grouped = new Map();
    state.rows.forEach(row => {
        if (!selectedMonths.includes(row["Month_code"])) return;
        if (state.level === "subcategory" && row["Category"] !== state.selectedCategory) return;
        if (state.level === "item" && (row["Category"] !== state.selectedCategory || row["Subcategory"] !== state.selectedSubcategory)) return;

        const key = state.level === "category"
            ? row["Category"]
            : state.level === "subcategory"
                ? row["Subcategory"]
                : row["Item_Name"];

        const valueField = state.metricMode === "amount" ? state.amountField : state.percentField;
        const mapKey = `${key}||${row["Month_code"]}`;
        const current = grouped.get(mapKey) || 0;
        grouped.set(mapKey, current + (parseNumericValue(row[valueField]) || 0));
    });

    const seriesNames = [...new Set([...grouped.keys()].map(k => k.split("||")[0]))];
    const peakBySeries = new Map();
    seriesNames.forEach(name => {
        let peak = 0;
        selectedMonths.forEach(month => {
            const val = grouped.get(`${name}||${month}`) || 0;
            if (val > peak) peak = val;
        });
        peakBySeries.set(name, peak);
    });

    const sortedSeries = seriesNames.sort((a, b) => (peakBySeries.get(b) || 0) - (peakBySeries.get(a) || 0));
    const cappedSeries = state.level === "item" ? sortedSeries.slice(0, 20) : sortedSeries;

    return {
        series: cappedSeries,
        valueFor: (name, month) => grouped.get(`${name}||${month}`) || 0
    };
}

function renderDrillSeriesList(tabId, series) {
    const state = analyticsStateMap[tabId];
    const list = document.getElementById(`${tabId}DrillSeriesList`);
    const drillDownBtn = document.getElementById(`${tabId}DrillDown`);
    if (!state || !list) return;

    const previousSelection = list.value;
    const query = (state.drillSearchQuery || "").trim().toLowerCase();
    const filteredSeries = series.filter(name => !query || String(name).toLowerCase().includes(query));

    list.innerHTML = filteredSeries
        .map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        .join("");

    if (filteredSeries.includes(previousSelection)) {
        list.value = previousSelection;
    }

    if (!list.value && filteredSeries.length) {
        list.selectedIndex = 0;
    }

    if (drillDownBtn) {
        drillDownBtn.disabled = state.level === "item" || filteredSeries.length === 0;
    }
}

function updateDrilldownChart(tabId) {
    const state = analyticsStateMap[tabId];
    if (!state) return;

    const selectedMonths = [...state.selectedMonths].sort();
    const breadcrumb = document.getElementById(`${tabId}Breadcrumb`);
    const backBtn = document.getElementById(`${tabId}Back`);
    const metricToggle = document.getElementById(`${tabId}MetricToggle`);

    let path = "Category";
    if (state.level === "subcategory") {
        path = `Category: ${state.selectedCategory}`;
    } else if (state.level === "item") {
        path = `Category: ${state.selectedCategory} > Subcategory: ${state.selectedSubcategory}`;
    }
    if (breadcrumb) breadcrumb.textContent = path;
    if (backBtn) backBtn.disabled = state.level === "category";
    if (metricToggle) {
        metricToggle.textContent = state.metricMode === "percent" ? "Show Amount" : "Show %";
    }

    const { series, valueFor } = getDrilldownSeries(state, selectedMonths);
    state.currentSeries = series;
    renderDrillSeriesList(tabId, series);

    const palette = [
        "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
        "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"
    ];

    const datasets = series.map((name, idx) => ({
        label: name,
        data: selectedMonths.map(month => valueFor(name, month)),
        borderColor: palette[idx % palette.length],
        backgroundColor: palette[idx % palette.length],
        borderWidth: 2,
        tension: 0.2,
        spanGaps: true
    }));

    const canvas = document.getElementById(`${tabId}Chart`);
    if (!canvas) return;
    if (chartMap[tabId]) chartMap[tabId].destroy();

    chartMap[tabId] = new Chart(canvas, {
        type: "line",
        data: { labels: selectedMonths, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
                legend: { position: "bottom" },
                tooltip: {
                    callbacks: {
                        label: (ctx) => {
                            const v = ctx.parsed.y ?? 0;
                            if (state.metricMode === "amount") {
                                return `${ctx.dataset.label}: ${Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
                            }
                            return `${ctx.dataset.label}: ${Number(v).toFixed(2)}%`;
                        }
                    }
                },
                zoom: {
                    pan: { enabled: true, mode: "x" },
                    zoom: {
                        wheel: { enabled: true },
                        pinch: { enabled: true },
                        drag: { enabled: true },
                        mode: "x"
                    },
                    limits: { x: { minRange: 2 } }
                }
            },
            scales: {
                y: {
                    title: { display: true, text: state.metricMode === "amount" ? "Amount" : "Percentage %" },
                    ticks: {
                        callback: value => state.metricMode === "amount"
                            ? Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 })
                            : `${value}%`
                    }
                },
                x: {
                    title: { display: true, text: "Year-Month" },
                    ticks: { autoSkip: true, maxTicksLimit: 18 }
                }
            }
        }
    });
}

function parseCsvPromise(csvPath) {
    return new Promise((resolve, reject) => {
        Papa.parse(csvPath, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: res => resolve(res.data || []),
            error: err => reject(err)
        });
    });
}

async function renderOrderAnalytics(tabId, sub) {
    try {
        const [itemRows, orderTypeRows, orderTypeCategoryRows] = await Promise.all([
            parseCsvPromise(sub.itemCsv),
            parseCsvPromise(sub.orderTypeCsv),
            sub.orderTypeCategoryCsv ? parseCsvPromise(sub.orderTypeCategoryCsv) : Promise.resolve([]),
        ]);

        const months = [...new Set(itemRows.map(r => r.Month_code).filter(Boolean))].sort();
        const defaultMonths = months.slice(-12);
        analyticsStateMap[tabId] = {
            mode: "orderAnalytics",
            itemRows,
            orderTypeRows,
            orderTypeCategoryRows,
            allMonths: months,
            selectedMonths: new Set(defaultMonths.length ? defaultMonths : months),
            selectedDate: "ALL",
            seriesLabel: sub.seriesLabel || "Item_Name",
            valueLabel: sub.valueLabel || "Sales_Amount",
            alternateValueLabel: sub.alternateValueLabel || "",
            orderTypeValueLabel: sub.orderTypeValueLabel || "Orders",
            categoryField: sub.categoryField || "",
            allCategories: [],
            selectedCategories: new Set(),
            topBottomMetricMode: "primary",
            charts: {}
        };

        const categories = [...new Set(itemRows.map(r => String(r[analyticsStateMap[tabId].categoryField] || "").trim()).filter(Boolean))].sort();
        analyticsStateMap[tabId].allCategories = categories;
        analyticsStateMap[tabId].selectedCategories = new Set(categories);

        buildOrderAnalyticsMonthFilter(tabId);
        buildOrderAnalyticsCategoryFilter(tabId);
        buildOrderAnalyticsDateOptions(tabId);
        wireOrderAnalyticsEvents(tabId);
        updateOrderAnalyticsCharts(tabId);
    } catch (err) {
        console.error("Order analytics failed:", err);
    }
}

function buildOrderAnalyticsMonthFilter(tabId) {
    const state = analyticsStateMap[tabId];
    const box = document.getElementById(`${tabId}MonthFilterBox`);
    if (!state || !box) return;
    box.innerHTML = state.allMonths.map(month => {
        const checked = state.selectedMonths.has(month) ? "checked" : "";
        const safeValue = escapeHtml(month);
        const encodedValue = encodeURIComponent(month);
        const safeId = `${tabId}_month_${encodedValue}`;
        return `
            <div class="form-check mb-1">
                <input class="form-check-input order-month-checkbox" type="checkbox" data-value="${encodedValue}" id="${safeId}" ${checked}>
                <label class="form-check-label" for="${safeId}">${safeValue}</label>
            </div>`;
    }).join("");
}

function buildOrderAnalyticsDateOptions(tabId) {
    const state = analyticsStateMap[tabId];
    const dateSelect = document.getElementById(`${tabId}DateSelect`);
    if (!state || !dateSelect) return;
    const selectedMonths = [...state.selectedMonths];
    const dates = [...new Set(state.itemRows
        .filter(r => selectedMonths.includes(r.Month_code))
        .map(r => r.Order_Date)
        .filter(Boolean)
    )].sort();
    dateSelect.innerHTML = `<option value="ALL">All Dates</option>` +
        dates.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    if (state.selectedDate !== "ALL" && dates.includes(state.selectedDate)) {
        dateSelect.value = state.selectedDate;
    } else {
        state.selectedDate = "ALL";
        dateSelect.value = "ALL";
    }
}

function buildOrderAnalyticsCategoryFilter(tabId) {
    const state = analyticsStateMap[tabId];
    const box = document.getElementById(`${tabId}CategoryFilterBox`);
    if (!state || !box || !state.categoryField) return;

    const categories = state.allCategories || [];

    box.innerHTML = categories.map(cat => {
        const checked = state.selectedCategories.has(cat) ? "checked" : "";
        const safeValue = escapeHtml(cat);
        const encodedValue = encodeURIComponent(cat);
        const safeId = `${tabId}_category_${encodedValue}`;
        return `
            <div class="form-check mb-1">
                <input class="form-check-input order-category-checkbox" type="checkbox" data-value="${encodedValue}" id="${safeId}" ${checked}>
                <label class="form-check-label" for="${safeId}">${safeValue}</label>
            </div>`;
    }).join("");
}

function wireOrderAnalyticsEvents(tabId) {
    const state = analyticsStateMap[tabId];
    if (!state || state.eventsBound) return;
    state.eventsBound = true;

    const monthSearch = document.getElementById(`${tabId}MonthSearch`);
    const monthBox = document.getElementById(`${tabId}MonthFilterBox`);
    const monthSelectAll = document.getElementById(`${tabId}MonthSelectAll`);
    const monthClear = document.getElementById(`${tabId}MonthClear`);
    const dateSelect = document.getElementById(`${tabId}DateSelect`);
    const categorySearch = document.getElementById(`${tabId}CategorySearch`);
    const categoryBox = document.getElementById(`${tabId}CategoryFilterBox`);
    const categorySelectAll = document.getElementById(`${tabId}CategorySelectAll`);
    const categoryClear = document.getElementById(`${tabId}CategoryClear`);
    const topBottomMetricToggle = document.getElementById(`${tabId}TopBottomMetricToggle`);

    const filterCheckboxList = (box, searchValue) => {
        const query = (searchValue || "").trim().toLowerCase();
        box.querySelectorAll(".form-check").forEach(wrapper => {
            const label = wrapper.querySelector("label")?.textContent?.toLowerCase() || "";
            wrapper.style.display = !query || label.includes(query) ? "" : "none";
        });
    };

    monthSearch?.addEventListener("input", () => filterCheckboxList(monthBox, monthSearch.value));
    categorySearch?.addEventListener("input", () => filterCheckboxList(categoryBox, categorySearch.value));

    monthBox?.addEventListener("change", e => {
        if (!e.target.classList.contains("order-month-checkbox")) return;
        const val = decodeURIComponent(e.target.dataset.value);
        if (e.target.checked) state.selectedMonths.add(val);
        else state.selectedMonths.delete(val);
        buildOrderAnalyticsDateOptions(tabId);
        updateOrderAnalyticsCharts(tabId);
    });

    monthSelectAll?.addEventListener("click", () => {
        state.selectedMonths = new Set(state.allMonths);
        buildOrderAnalyticsMonthFilter(tabId);
        filterCheckboxList(monthBox, monthSearch.value);
        buildOrderAnalyticsDateOptions(tabId);
        updateOrderAnalyticsCharts(tabId);
    });

    monthClear?.addEventListener("click", () => {
        state.selectedMonths = new Set();
        buildOrderAnalyticsMonthFilter(tabId);
        filterCheckboxList(monthBox, monthSearch.value);
        buildOrderAnalyticsDateOptions(tabId);
        updateOrderAnalyticsCharts(tabId);
    });

    categoryBox?.addEventListener("change", e => {
        if (!e.target.classList.contains("order-category-checkbox")) return;
        const val = decodeURIComponent(e.target.dataset.value);
        if (e.target.checked) state.selectedCategories.add(val);
        else state.selectedCategories.delete(val);
        updateOrderAnalyticsCharts(tabId);
    });

    categorySelectAll?.addEventListener("click", () => {
        state.selectedCategories = new Set(state.allCategories);
        buildOrderAnalyticsCategoryFilter(tabId);
        filterCheckboxList(categoryBox, categorySearch.value);
        updateOrderAnalyticsCharts(tabId);
    });

    categoryClear?.addEventListener("click", () => {
        state.selectedCategories = new Set();
        buildOrderAnalyticsCategoryFilter(tabId);
        filterCheckboxList(categoryBox, categorySearch.value);
        updateOrderAnalyticsCharts(tabId);
    });

    dateSelect?.addEventListener("change", () => {
        state.selectedDate = dateSelect.value || "ALL";
        updateOrderAnalyticsCharts(tabId);
    });

    topBottomMetricToggle?.addEventListener("click", () => {
        if (!state.alternateValueLabel) return;
        state.topBottomMetricMode = state.topBottomMetricMode === "primary" ? "alternate" : "primary";
        updateOrderAnalyticsCharts(tabId);
    });
}

function buildTopBottomSeries(rows, keyField, valueField) {
    const map = new Map();
    rows.forEach(r => {
        const key = String(r[keyField] || "").trim();
        if (!key) return;
        const current = map.get(key) || 0;
        map.set(key, current + (parseNumericValue(r[valueField]) || 0));
    });
    const entries = [...map.entries()].sort((a, b) => b[1] - a[1]);
    return {
        top: entries.slice(0, 10),
        bottom: [...entries].reverse().slice(0, 10).reverse()
    };
}

function buildOrderTypeSeries(rows, valueField) {
    const dates = [...new Set(rows.map(r => r.Order_Date).filter(Boolean))].sort();
    const types = [...new Set(rows.map(r => r.Order_Type || "Unknown"))].sort();
    const valMap = new Map();
    rows.forEach(r => {
        const key = `${r.Order_Type || "Unknown"}||${r.Order_Date}`;
        const current = valMap.get(key) || 0;
        valMap.set(key, current + (parseNumericValue(r[valueField]) || 0));
    });
    return {
        dates,
        datasets: types.map((t, idx) => {
            const palette = [
                "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
                "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"
            ];
            return {
                label: t,
                data: dates.map(d => valMap.get(`${t}||${d}`) || 0),
                borderColor: palette[idx % palette.length],
                backgroundColor: palette[idx % palette.length],
                borderWidth: 2,
                tension: 0.2
            };
        })
    };
}

function renderOrReplaceChart(targetMap, key, canvasId, config) {
    if (targetMap[key]) targetMap[key].destroy();
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    targetMap[key] = new Chart(canvas, config);
}

function updateOrderAnalyticsCharts(tabId) {
    const state = analyticsStateMap[tabId];
    if (!state) return;
    const months = [...state.selectedMonths];
    let filteredItems = state.itemRows.filter(r => months.includes(r.Month_code));
    let filteredTypes = state.orderTypeRows.filter(r => months.includes(r.Month_code));
    let filteredTypesByCategory = (state.orderTypeCategoryRows || []).filter(r => months.includes(r.Month_code));
    if (state.selectedDate !== "ALL") {
        filteredItems = filteredItems.filter(r => r.Order_Date === state.selectedDate);
        filteredTypes = filteredTypes.filter(r => r.Order_Date === state.selectedDate);
        filteredTypesByCategory = filteredTypesByCategory.filter(r => r.Order_Date === state.selectedDate);
    }
    if (state.categoryField) {
        filteredItems = filteredItems.filter(r => state.selectedCategories.has(String(r[state.categoryField] || "").trim()));
        filteredTypesByCategory = filteredTypesByCategory.filter(r =>
            state.selectedCategories.has(String(r[state.categoryField] || "").trim())
        );
    }

    const categorySelectionActive = state.categoryField
        && state.selectedCategories.size > 0
        && state.selectedCategories.size < state.allCategories.length;
    if (state.categoryField && state.selectedCategories.size === 0) {
        filteredTypes = [];
    } else if (categorySelectionActive && filteredTypesByCategory.length) {
        const deliveryTypes = filteredTypes.filter(r => String(r.Order_Type) === "Delivery");
        const typeMap = new Map();
        filteredTypesByCategory.forEach(r => {
            const key = `${r.Month_code}||${r.Order_Date}||${r.Order_Type}`;
            const existing = typeMap.get(key) || { ...r, Orders: 0, Sales_Amount: 0 };
            existing.Orders += parseNumericValue(r.Orders) || 0;
            existing.Sales_Amount += parseNumericValue(r.Sales_Amount) || 0;
            typeMap.set(key, existing);
        });
        filteredTypes = [...typeMap.values(), ...deliveryTypes];
    }

    const metricField = state.topBottomMetricMode === "alternate" && state.alternateValueLabel
        ? state.alternateValueLabel
        : state.valueLabel;
    const metricLabel = metricField === state.valueLabel ? "Amount" : "Orders";
    const topBottomMetricToggle = document.getElementById(`${tabId}TopBottomMetricToggle`);
    if (topBottomMetricToggle) {
        topBottomMetricToggle.textContent = `Top/Bottom by ${metricLabel}`;
    }

    const { top, bottom } = buildTopBottomSeries(filteredItems, state.seriesLabel, metricField);
    const orderType = buildOrderTypeSeries(filteredTypes, state.orderTypeValueLabel);

    renderOrReplaceChart(
        state.charts,
        "top",
        `${tabId}TopChart`,
        {
            type: "bar",
            data: {
                labels: top.map(x => x[0]),
                datasets: [{ label: `Top 10 (${metricLabel})`, data: top.map(x => x[1]), backgroundColor: "#2ca02c" }]
            },
            options: { indexAxis: "y", responsive: true, maintainAspectRatio: false }
        }
    );

    renderOrReplaceChart(
        state.charts,
        "bottom",
        `${tabId}BottomChart`,
        {
            type: "bar",
            data: {
                labels: bottom.map(x => x[0]),
                datasets: [{ label: `Bottom 10 (${metricLabel})`, data: bottom.map(x => x[1]), backgroundColor: "#d62728" }]
            },
            options: { indexAxis: "y", responsive: true, maintainAspectRatio: false }
        }
    );

    renderOrReplaceChart(
        state.charts,
        "type",
        `${tabId}TypeChart`,
        {
            type: "line",
            data: { labels: orderType.dates, datasets: orderType.datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: "index", intersect: false },
                plugins: { legend: { position: "bottom" } },
                scales: { x: { ticks: { autoSkip: true, maxTicksLimit: 18 } } }
            }
        }
    );
}

function renderSalarySummary(tabId, sub) {
    Papa.parse(sub.csv, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: res => {
            const rows = (res.data || []).map(row => ({
                Date: row.Date || "",
                Name: String(row.Name || "").trim(),
                Amount: parseNumericValue(row.Amount) || 0
            }));

            const validRows = rows.filter(row => row.Date && row.Name);
            const settlementDaySelect = document.getElementById(`${tabId}SettlementDay`);
            const applyBtn = document.getElementById(`${tabId}Apply`);
            const resetBtn = document.getElementById(`${tabId}Reset`);
            const downloadBtn = document.getElementById(`${tabId}Download`);

            if (settlementDaySelect) {
                settlementDaySelect.innerHTML = Array.from({ length: 31 }, (_, idx) => {
                    const day = idx + 1;
                    return `<option value="${day}">${day}</option>`;
                }).join("");
                settlementDaySelect.value = "13";
            }

            const getLastDayOfMonth = (year, month1to12) =>
                new Date(Date.UTC(year, month1to12, 0)).getUTCDate();

            const parseIsoDate = (value) => {
                const [yy, mm, dd] = String(value || "").split("-").map(Number);
                if (!yy || !mm || !dd) return null;
                return { year: yy, month: mm, day: dd };
            };

            const getPayrollMonthLabel = (isoDate, settlementDay) => {
                const dateParts = parseIsoDate(isoDate);
                if (!dateParts) return "";

                const { year, month, day } = dateParts;
                const sameMonthEndDay = Math.min(settlementDay, getLastDayOfMonth(year, month));
                let cycleEndYear = year;
                let cycleEndMonth = month;

                if (day > sameMonthEndDay) {
                    cycleEndMonth += 1;
                    if (cycleEndMonth === 13) {
                        cycleEndMonth = 1;
                        cycleEndYear += 1;
                    }
                }

                let labelYear = cycleEndYear;
                let labelMonth = cycleEndMonth - 1;
                if (labelMonth === 0) {
                    labelMonth = 12;
                    labelYear -= 1;
                }

                return `${labelYear}-${String(labelMonth).padStart(2, "0")}`;
            };

            const refresh = () => {
                const settlementDay = Number(settlementDaySelect?.value || 13);

                const groupedMap = new Map();
                validRows.forEach(row => {
                    const payrollMonth = getPayrollMonthLabel(row.Date, settlementDay);
                    const key = `${payrollMonth}||${row.Name}`;
                    groupedMap.set(key, (groupedMap.get(key) || 0) + row.Amount);
                });

                const groupedRows = [...groupedMap.entries()]
                    .map(([key, amount]) => {
                        const [yearMonth, name] = key.split("||");
                        return { YEAR_MONTH: yearMonth, Name: name, Amount: amount };
                    })
                    .filter(row => row.YEAR_MONTH)
                    .sort((a, b) => {
                        if (a.YEAR_MONTH === b.YEAR_MONTH) return a.Name.localeCompare(b.Name);
                        return b.YEAR_MONTH.localeCompare(a.YEAR_MONTH);
                    });

                if (tableMap[tabId]) {
                    tableMap[tabId].clear();
                    tableMap[tabId].rows.add(groupedRows);
                    tableMap[tabId].draw();
                } else {
                    tableMap[tabId] = $("#" + tabId + "Table").DataTable({
                        data: groupedRows,
                        columns: [
                            { title: "YEAR_MONTH", data: "YEAR_MONTH" },
                            { title: "Name", data: "Name" },
                            {
                                title: "Amount",
                                data: "Amount",
                                render: (data, type) => {
                                    const numericValue = parseNumericValue(data) || 0;
                                    if (type === "sort" || type === "type") return numericValue;
                                    return Number(numericValue).toLocaleString(undefined, {
                                        minimumFractionDigits: 2,
                                        maximumFractionDigits: 2
                                    });
                                }
                            }
                        ],
                        pageLength: 50,
                        order: [[0, "desc"], [1, "asc"]],
                        autoWidth: false,
                        scrollX: true
                    });
                }
            };

            applyBtn?.addEventListener("click", refresh);
            resetBtn?.addEventListener("click", () => {
                if (settlementDaySelect) settlementDaySelect.value = "13";
                refresh();
            });
            downloadBtn?.addEventListener("click", () => {
                const table = tableMap[tabId];
                if (!table) return;
                const rowsToExport = table.rows({ search: "applied" }).data().toArray();
                const csv = Papa.unparse(rowsToExport);
                const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                const selectedDay = settlementDaySelect?.value || "13";
                a.download = `salary_summary_settlement_day_${selectedDay}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            });

            refresh();
        }
    });
}

document.addEventListener("shown.bs.tab", () => {
    Object.values(tableMap).forEach(t => t && t.columns.adjust());
});

document.addEventListener("click", (e) => {
    const navBtn = e.target.closest("#dataTabs .nav-link");
    if (!navBtn) return;
    const group = Number(navBtn.closest("li")?.dataset.group);
    if (isAuditor && group !== auditorGroupIndex) {
        e.preventDefault();
        e.stopPropagation();
        showAdminOnlyNotification();
        return;
    }

    const sectionHeading = document.getElementById("sectionHeading");
    if (sectionHeading) {
        sectionHeading.textContent = navBtn.textContent?.trim() || "Summary";
    }
});

document.addEventListener("click", (e) => {
    const btn = e.target.closest(".download-btn");
    if (!btn) return;
    const tabId = btn.dataset.tabId;
    const table = tableMap[tabId];
    if (!table) return;

    const headers = table.columns().header().toArray().map(h => h.textContent.trim());
    const rows = table.rows({ search: "applied" }).data().toArray();

    const data = rows.map(row => {
        const obj = {};
        headers.forEach(h => {
            obj[h] = row[h] ?? "";
        });
        return obj;
    });

    const csv = Papa.unparse(data);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${tabId}_filtered.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
});

async function updateLastRefreshedFromAllCSVs() {
    const csvs = [
        ...new Set(
            config.flatMap(g =>
                g.subtabs.flatMap(s => [s.csv, s.itemCsv, s.orderTypeCsv, s.orderTypeCategoryCsv].filter(Boolean))
            )
        )
    ];
    let latest = null;

    for (const file of csvs) {
        try {
            const r = await fetch(file, { method: "HEAD" });
            const lm = r.headers.get("Last-Modified");
            if (!lm) continue;
            const d = new Date(lm);
            if (!latest || d > latest) latest = d;
        } catch {}
    }

    document.getElementById("lastRefreshed").textContent =
        latest ? latest.toLocaleString() : "Unavailable";
}
</script>
