<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Pizza Pie Land Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 15% 20%, #334155 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, #1d4ed8 0%, transparent 35%),
                        linear-gradient(135deg, var(--bg-start), var(--bg-end));
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            width: min(440px, 100%);
            border: 0;
            border-radius: 18px;
            background: var(--card-bg);
            box-shadow: 0 20px 48px rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(6px);
            animation: rise 350ms ease;
        }

        .card-body {
            padding: 30px;
        }

        .login-title {
            font-size: 1.55rem;
            font-weight: 700;
            color: #0f172a;
        }

        .login-subtitle {
            color: #475569;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
        }

        .form-control {
            border-radius: 12px;
            padding: 10px 12px;
        }

        .btn-login {
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .login-message {
            min-height: 22px;
            font-size: 0.92rem;
            margin-top: 8px;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-body">
            <h1 class="login-title mb-2">Dashboard Login</h1>
            <p class="login-subtitle">Sign in to continue to Pizza Pie Land Dashboard.</p>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input id="loginEmail" type="email" class="form-control" placeholder="Username" autocomplete="username" required>
                </div>
                <div class="mb-2">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input id="loginPassword" type="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                </div>
                <div id="loginMessage" class="login-message text-danger"></div>
                <button type="submit" class="btn btn-primary btn-login w-100">Enter Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        const ENCODED_USER = "YWRtaW5AbG9vY29zLmNvbQ==";
        const ENCODED_PASS = "bG9vY29zQDIwMjY=";
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        if (localStorage.getItem("dashboard_authed") === "true") {
            window.location.replace("Dashboard.html");
        }

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            const userOk = btoa(email) === ENCODED_USER;
            const passOk = btoa(password) === ENCODED_PASS;

            if (userOk && passOk) {
                localStorage.setItem("dashboard_authed", "true");
                loginMessage.textContent = "";
                window.location.replace("Dashboard.html");
            } else {
                loginMessage.textContent = "Invalid username or password.";
            }
        });
    </script>
</body>
</html>
