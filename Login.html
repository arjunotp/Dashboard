<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Loocos Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f4f6fb;
            --bg-2: #e8f5ff;
            --bg-3: #f8f6ff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --brand: #0b6bcb;
            --brand-dark: #0857a5;
            --card-bg: rgba(255, 255, 255, 0.86);
            --card-border: rgba(255, 255, 255, 0.64);
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
            --input-border: #d0d9e6;
            --error: #b42318;
            --success: #067647;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text-main);
            font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(800px 500px at -10% -20%, #c8ecff 0%, transparent 65%),
                radial-gradient(740px 480px at 110% 10%, #d9d7ff 0%, transparent 62%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(2px);
        }

        body::before {
            width: 320px;
            height: 320px;
            bottom: -130px;
            left: -90px;
            background: rgba(11, 107, 203, 0.18);
        }

        body::after {
            width: 260px;
            height: 260px;
            top: -110px;
            right: -70px;
            background: rgba(38, 119, 255, 0.16);
        }

        .login-shell {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            animation: enter 420ms ease;
        }

        .brand-pane {
            padding: 52px 44px;
            background: linear-gradient(180deg, rgba(15, 54, 122, 0.95), rgba(5, 29, 72, 0.95));
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            isolation: isolate;
        }

        .brand-pane::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(420px 220px at 105% -8%, rgba(255, 255, 255, 0.2), transparent 70%),
                radial-gradient(360px 280px at -15% 108%, rgba(56, 189, 248, 0.22), transparent 62%);
            z-index: -1;
        }

        .logo-mark {
            width: min(240px, 85%);
            height: auto;
            display: block;
            margin: 0 auto 22px;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.28));
        }

        .brand-header {
            text-align: center;
        }

        .brand-title {
            margin: 0;
            font-size: clamp(1.6rem, 2.4vw, 2.05rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-copy {
            margin: 12px 0 0;
            color: rgba(241, 245, 249, 0.88);
            line-height: 1.6;
        }

        .brand-footnote {
            margin-top: 26px;
            font-size: 0.86rem;
            color: rgba(226, 232, 240, 0.82);
        }

        .form-pane {
            padding: 54px 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.92));
        }

        .form-wrap {
            width: min(380px, 100%);
        }

        .eyebrow {
            margin: 0;
            font-size: 0.84rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #0b6bcb;
        }

        .form-title {
            margin: 10px 0 8px;
            font-size: clamp(1.6rem, 2.2vw, 1.9rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .form-subtitle {
            margin: 0 0 26px;
            color: var(--text-muted);
            line-height: 1.55;
        }

        .field {
            margin-bottom: 16px;
        }

        .label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
        }

        .input {
            width: 100%;
            border: 1px solid var(--input-border);
            background: #ffffff;
            color: #0f172a;
            font-size: 0.95rem;
            border-radius: 12px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .input::placeholder {
            color: #8a98ab;
        }

        .input:focus {
            border-color: #67a9ea;
            box-shadow: 0 0 0 4px rgba(103, 169, 234, 0.2);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 4px 0 18px;
            font-size: 0.88rem;
            color: #334155;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: var(--brand);
        }

        .helper-link {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .helper-link:hover {
            color: var(--brand-dark);
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 800;
            font-size: 0.97rem;
            letter-spacing: 0.01em;
            color: #ffffff;
            background: linear-gradient(90deg, #0b6bcb 0%, #1286ea 100%);
            box-shadow: 0 14px 28px rgba(11, 107, 203, 0.28);
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 180ms ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 32px rgba(11, 107, 203, 0.32);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 12px;
            min-height: 22px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .message.error {
            color: var(--error);
        }

        .message.success {
            color: var(--success);
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .login-shell {
                grid-template-columns: 1fr;
                max-width: 560px;
            }

            .brand-pane {
                padding: 36px 30px;
            }

            .brand-footnote {
                margin-top: 16px;
            }

            .form-pane {
                padding: 34px 30px 38px;
            }
        }

        @media (max-width: 460px) {
            body {
                padding: 14px;
            }

            .brand-pane,
            .form-pane {
                padding-left: 20px;
                padding-right: 20px;
            }

            .actions {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell" aria-label="Loocos Monitor Login">
        <section class="brand-pane" aria-hidden="true">
            <div class="brand-header">
                <img class="logo-mark" src="Loocos%20Logo.png" alt="Loocos logo">
                <h1 class="brand-title">Pizza Pie Land</h1>
                <p class="brand-copy">Operational dashboard access for finance, inventory, and settlement insights.</p>
            </div>
            <p class="brand-footnote">Authorized users only. Activity may be logged for security and audit purposes.</p>
        </section>

        <section class="form-pane">
            <div class="form-wrap">
                <p class="eyebrow">Secure Access</p>
                <h2 class="form-title">Sign in to continue</h2>
                <p class="form-subtitle">Use your dashboard credentials to access Loocos business reports.</p>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label class="label" for="loginEmail">Email</label>
                        <input id="loginEmail" class="input" type="email" placeholder="you@loocos.com" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label class="label" for="loginPassword">Password</label>
                        <input id="loginPassword" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <div class="actions">
                        <label class="remember" for="rememberSession">
                            <input id="rememberSession" type="checkbox" checked>
                            Keep me signed in
                        </label>
                        <a class="helper-link" href="javascript:void(0)" aria-disabled="true">Need help?</a>
                    </div>

                    <button type="submit" class="login-button">Enter Dashboard</button>
                    <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const API_BASE_URL = "https://script.google.com/macros/s/AKfycbwsyv-NGq-3euWcNp4O7qxiHsgi84hU1B6KcUpe36S3oNyuk4JKHjyvalipMoDQl0rRmQ/exec";
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = loginForm.querySelector('button[type="submit"]');

        function isAuthenticated() {
            return Boolean(sessionStorage.getItem("apiKey"));
        }

        function clearAuthState() {
            sessionStorage.removeItem("apiKey");
            sessionStorage.removeItem("userType");
            localStorage.removeItem("dashboard_authed");
            localStorage.removeItem("dashboard_role");
            sessionStorage.removeItem("dashboard_authed");
            sessionStorage.removeItem("dashboard_role");
        }

        async function sha256Hex(text) {
            const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return [...new Uint8Array(buffer)]
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        function showMessage(text, kind) {
            loginMessage.textContent = text;
            loginMessage.className = "message " + kind;
        }

        function setBusyState(isBusy) {
            loginButton.disabled = isBusy;
            loginButton.textContent = isBusy ? "Signing in..." : "Enter Dashboard";
        }

        if (isAuthenticated()) {
            window.location.replace("Dashboard.html");
        }

        clearAuthState();

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!username || !password) {
                showMessage("Enter both username and password.", "error");
                return;
            }

            setBusyState(true);
            showMessage("", "");

            try {
                const apiKey = await sha256Hex(`${username}:${password}`);
                const response = await fetch(
                    `${API_BASE_URL}?key=${encodeURIComponent(apiKey)}&type=login`,
                    { method: "GET", cache: "no-store" }
                );
                const result = (await response.text()).trim();

                if (!response.ok) {
                    throw new Error(`Login request failed with status ${response.status}`);
                }

                if (result.startsWith("SUCCESS:")) {
                    const userType = result.slice("SUCCESS:".length).trim() || "viewer";
                    clearAuthState();
                    sessionStorage.setItem("apiKey", apiKey);
                    sessionStorage.setItem("userType", userType);
                    showMessage("Login successful. Redirecting...", "success");
                    window.setTimeout(() => {
                        window.location.replace("Dashboard.html");
                    }, 200);
                    return;
                }

                clearAuthState();
                showMessage("Invalid username or password.", "error");
            } catch (error) {
                clearAuthState();
                showMessage("Unable to sign in right now. Please try again.", "error");
                console.error("Login failed:", error);
            } finally {
                setBusyState(false);
            }
        });
    </script>
</body>
</html>
